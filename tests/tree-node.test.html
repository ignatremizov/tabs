<html>

  <style>
    body { font-family: system-ui, sans-serif; margin: 20px; }
    .test-pass { color: green; }
    .test-fail { color: red; font-weight: bold; }
    .test-section { margin: 20px 0; padding: 10px; border: 1px solid #ccc; }
    .test-section h2 { margin-top: 0; }

</head>
<body>
  <h1>Tree/Node Tests</h1>
  <div id="summary"></div>
  <div id="results"></div>

  <script>
    const params = new URLSearchParams(location.search);
    let env = params.get('env');
    if (! env) {
      const ua = navigator.userAgent || '';
      env = ua.includes('Firefox') ? 'firefox' : 'chrome';
    }
    window.testEnv = env;

    function ensureApi(api) {
      if (!api.runtime) api.runtime = {};
      if (!api.runtime.sendMessage) api.runtime.sendMessage = async () => ({});
      if (!api.runtime.onMessage) api.runtime.onMessage = {};
      if (!api.runtime.onMessage.addListener) {
        api.runtime.onMessage.addListener = () => {};
      }
      if (!api.runtime.onConnect) api.runtime.onConnect = {};
      if (!api.runtime.onConnect.addListener) {
        api.runtime.onConnect.addListener = () => {};
      }

      if (!api.tabs) api.tabs = {};
      if (!api.tabs.remove) api.tabs.remove = async () => {};
      if (!api.tabs.get) api.tabs.get = async () => ({});
      if (!api.tabs.move) api.tabs.move = async () => {};
      if (!api.tabs.update) api.tabs.update = async () => ({});
      if (!api.tabs.query) api.tabs.query = async () => ([]);
      if (!api.tabs.create) api.tabs.create = async () => ({});
      if (!api.tabs.onCreated) api.tabs.onCreated = {};
      if (!api.tabs.onCreated.addListener) {
        api.tabs.onCreated.addListener = () => {};
      }
      if (!api.tabs.onRemoved) api.tabs.onRemoved = {};
      if (!api.tabs.onRemoved.addListener) {
        api.tabs.onRemoved.addListener = () => {};
      }
      if (!api.tabs.onActivated) api.tabs.onActivated = {};
      if (!api.tabs.onActivated.addListener) {
        api.tabs.onActivated.addListener = () => {};
      }
      if (!api.tabs.onMoved) api.tabs.onMoved = {};
      if (!api.tabs.onMoved.addListener) {
        api.tabs.onMoved.addListener = () => {};
      }
      if (!api.tabs.onAttached) api.tabs.onAttached = {};
      if (!api.tabs.onAttached.addListener) {
        api.tabs.onAttached.addListener = () => {};
      }
      if (!api.tabs.onDetached) api.tabs.onDetached = {};
      if (!api.tabs.onDetached.addListener) {
        api.tabs.onDetached.addListener = () => {};
      }
      if (!api.tabs.onUpdated) api.tabs.onUpdated = {};
      if (!api.tabs.onUpdated.addListener) {
        api.tabs.onUpdated.addListener = () => {};
      }
      if (!api.tabs.onReplaced) api.tabs.onReplaced = {};
      if (!api.tabs.onReplaced.addListener) {
        api.tabs.onReplaced.addListener = () => {};
      }

      if (!api.windows) api.windows = {};
      if (!api.windows.remove) api.windows.remove = async () => {};
      if (!api.windows.get) api.windows.get = async () => ({});
      if (!api.windows.onCreated) api.windows.onCreated = {};
      if (!api.windows.onCreated.addListener) {
        api.windows.onCreated.addListener = () => {};
      }
      if (!api.windows.onRemoved) api.windows.onRemoved = {};
      if (!api.windows.onRemoved.addListener) {
        api.windows.onRemoved.addListener = () => {};
      }
      if (!api.windows.onFocusChanged) api.windows.onFocusChanged = {};
      if (!api.windows.onFocusChanged.addListener) {
        api.windows.onFocusChanged.addListener = () => {};
      }
      if (!api.windows.getAll) api.windows.getAll = async () => ([]);
      if (!api.windows.create) api.windows.create = async () => ({});
      if (!api.windows.onBoundsChanged) api.windows.onBoundsChanged = {};
      if (!api.windows.onBoundsChanged.addListener) {
        api.windows.onBoundsChanged.addListener = () => {};
      }

      if (!api.downloads) api.downloads = {};
      if (!api.downloads.download) api.downloads.download = async () => (1);
      if (!api.downloads.onChanged) {
        api.downloads.onChanged = {
          addListener: () => {},
          removeListener: () => {}
        };
      }

      if (!api.storage) api.storage = {};
      if (!api.storage.local) {
        const localStore = {};
        api.storage.local = {
          _store: localStore,
          get: async (keys) => {
            if (! keys) return { ...localStore };
            if ('string' === typeof keys) return { [keys]: localStore[keys] };
            if (Array.isArray(keys)) {
              const result = {};
              for (const key of keys) result[key] = localStore[key];
              return result;
            }
            if (keys && ('object' === typeof keys)) {
              const result = {};
              for (const key of Object.keys(keys)) {
                result[key] = (key in localStore) ? localStore[key] : keys[key];
              }
              return result;
            }
            return {};
          },
          set: async (items) => {
            Object.assign(localStore, items);
          }
        };
      }
      if (!api.storage.onChanged) api.storage.onChanged = {};
      if (!api.storage.onChanged.addListener) {
        api.storage.onChanged.addListener = () => {};
      }

      if (!api.commands) api.commands = {};
      if (!api.commands.onCommand) api.commands.onCommand = {};
      if (!api.commands.onCommand.addListener) {
        api.commands.onCommand.addListener = () => {};
      }

      if (!api.alarms) api.alarms = {};
      if (!api.alarms.onAlarm) api.alarms.onAlarm = {};
      if (!api.alarms.onAlarm.addListener) {
        api.alarms.onAlarm.addListener = () => {};
      }
      if (!api.alarms.get) api.alarms.get = async () => null;
      if (!api.alarms.clear) api.alarms.clear = async () => {};
      if (!api.alarms.create) api.alarms.create = async () => {};

      if (!api.sidePanel) api.sidePanel = {};
      if (!api.sidePanel.setPanelBehavior) {
        api.sidePanel.setPanelBehavior = async () => {};
      }
    }

    if ('firefox' === env) {
      if (!window.browser) window.browser = {};
      ensureApi(window.browser);
    } else {
      if (!window.chrome) window.chrome = {};
      ensureApi(window.chrome);
    }

    if (!window.chrome) window.chrome = {};
    ensureApi(window.chrome);
  </script>
  <script type="module">
    "use strict";

    async function main() {
      const env = window.testEnv || 'chrome';
      const $summary = document.getElementById('summary');
      const $title = document.querySelector('h1');
      $title.textContent = `Tree/Node Tests (${env})`;

      if ('file:' === location.protocol) {
        $summary.textContent = 'Run via http (example: python3 -m http.server).';
        $summary.className = 'has-fail';
        return;
      }

      let Tree;
      let Node;
      let isIllegalURL;
      let sanitizeClientId;
      let initClientIdForm;
      let base32decode;
      let base32encode;
      let IdGenerator;
      let Bkgd;
      let NodeView;
      try {
        const cacheBust = `?v=${Date.now()}`;
        const [
          treeMod,
          nodeMod,
          commonMod,
          optionsMod,
          base32Mod,
          idGenMod,
          bkgdMod,
          nodeViewMod
        ] = await Promise.all([
          import('../common/tree.js' + cacheBust),
          import('../common/node.js' + cacheBust),
          import('../common/common.js' + cacheBust),
          import('../options/client-id-form.js' + cacheBust),
          import('../common/base32.js' + cacheBust),
          import('../common/id-generator.js' + cacheBust),
          import('../bkgd/bkgd.js' + cacheBust),
          import('../view/nodeview.js' + cacheBust)
        ]);
        Tree = treeMod.Tree;
        Node = nodeMod.Node;
        isIllegalURL = commonMod.isIllegalURL;
        sanitizeClientId = commonMod.sanitizeClientId;
        initClientIdForm = optionsMod.initClientIdForm;
        base32decode = base32Mod.base32decode;
        base32encode = base32Mod.base32encode;
        IdGenerator = idGenMod.IdGenerator;
        Bkgd = bkgdMod.Bkgd;
        NodeView = nodeViewMod.NodeView;
      } catch (err) {
        $summary.textContent = `Failed to load modules: ${err}`;
        $summary.className = 'has-fail';
        return;
      }

      class TestNode extends Node {
        newNodeId () {
          this.tree.nextId += 1;
          return `test-${this.tree.nextId}`;
        }

        async addChild (index, details, ...extra) {
          if (! details.id) details.id = this.newNodeId();
          return await super.addChild(index, details, ...extra);
        }

        async reorderAllTabsInThisWindow () {
          this.tree.reorderCalled = true;
        }
      }

      function createTree() {
        const tree = new Tree(TestNode);
        tree.nextId = 0;
        tree.bkgd = { windowsLoading: [], nodesLoading: [] };
        tree.resolveTreeLoaded();
        return tree;
      }

      const tests = [];

      function testGroup(title) {
        tests.push({ type: 'group', title });
      }

      function test(name, fn) {
        tests.push({ type: 'test', name, fn });
      }

      function assert(condition, message) {
        if (!condition) {
          throw new Error(message || 'Assertion failed');
        }
      }

      function assertEqual(actual, expected, message) {
        if (actual !== expected) {
          throw new Error(message || `Expected "${expected}" but got "${actual}"`);
        }
      }

      function makeAssertionError(message, snapshot) {
        const err = new Error(message || 'Assertion failed');
        if (snapshot) err.snapshot = snapshot;
        return err;
      }

      function assertWithSnapshot(condition, message, snapshot) {
        if (!condition) throw makeAssertionError(message, snapshot);
      }

      function assertEqualWithSnapshot(actual, expected, message, snapshot) {
        if (actual !== expected) {
          throw makeAssertionError(
            message || `Expected "${expected}" but got "${actual}"`,
            snapshot
          );
        }
      }

      function getApi() {
        return ('firefox' === env) ? window.browser : window.chrome;
      }

      function createStorageMock(initial = {}) {
        const store = { ...initial };
        const local = {
          get: async (keys) => {
            if (! keys) return { ...store };
            if ('string' === typeof keys) return { [keys]: store[keys] };
            if (Array.isArray(keys)) {
              const result = {};
              for (const key of keys) result[key] = store[key];
              return result;
            }
            if (keys && ('object' === typeof keys)) {
              const result = {};
              for (const key of Object.keys(keys)) {
                result[key] = (key in store) ? store[key] : keys[key];
              }
              return result;
            }
            return {};
          },
          set: async (items) => {
            Object.assign(store, items);
          }
        };
        return { store, apiStorage: { local, onChanged: { addListener: () => {} } } };
      }

      function createClientIdForm() {
        const form = document.createElement('form');
        form.id = 'options-form';
        const input = document.createElement('input');
        input.id = 'client-id';
        form.appendChild(input);
        document.body.appendChild(form);
        return { form, input };
      }

      function skipUnlessFirefox() {
        if ('firefox' !== env) return true;
        return false;
      }

      function treeSnapshot(root) {
        const lines = [];
        function walk(node, depth) {
          const indent = '  '.repeat(depth);
          const type = node.type ? node.type : 'node';
          const name = node.isRoot() ? 'root' : `${type}:${node.id}`;
          const parts = [
            `${indent}- ${name}`,
            node.windowId ? `win=${node.windowId}` : null,
            node.tabId ? `tab=${node.tabId}` : null,
            (! node.isRoot() && (node.loaded === true)) ? 'loaded' : null,
            (! node.isRoot() && (node.loaded === false)) ? 'unloaded' : null,
            node.label ? `label="${node.label}"` : null,
            node.title ? `title="${node.title}"` : null
          ].filter(Boolean);
          lines.push(parts.join(' '));
          for (const kid of node.nodes) walk(kid, depth + 1);
        }
        walk(root, 0);
        return lines.join('\n');
      }

      function formatLog(log) {
        if (!log || log.length === 0) return '';
        return `\nEvents:\n${log.map((line) => `- ${line}`).join('\n')}`;
      }

      function renderSnapshot(pre, snapshot) {
        pre.classList.add('snapshot');
        const lines = snapshot.split('\n');
        for (const line of lines) {
          const $line = document.createElement('span');
          $line.className = 'snap-line';
          const parts = line.split('- ');
          const indent = (parts.length > 1) ? parts[0] : '';
          const content = (parts.length > 1) ? parts.slice(1).join('- ') : line;
          const isRoot = content.startsWith('root');
          const isWindow = content.startsWith('window:');
          const isLabel = content.startsWith('node:') && content.includes('label=');
          const isLoaded = content.includes(' loaded');
          const isUnloaded = content.includes(' unloaded');

          const $indent = document.createTextNode(indent + '- ');
          const $dot = document.createElement('span');
          $dot.className = 'snap-dot';
          $dot.textContent = isLoaded ? '●' : (isUnloaded ? '○' : '•');
          if (isLoaded) $dot.classList.add('snap-loaded');
          if (isUnloaded) $dot.classList.add('snap-unloaded');
          if (isRoot) $dot.classList.add('snap-root');

          const $text = document.createElement('span');
          if (isRoot) $text.classList.add('snap-root');
          else if (isWindow) $text.classList.add('snap-window');
          else if (isLabel) $text.classList.add('snap-label');
          else $text.classList.add('snap-node');
          const statusMatch = content.match(/\s(loaded|unloaded)(?=\s|$)/);
          if (statusMatch) {
            const status = statusMatch[1];
            const index = statusMatch.index;
            const beforeText = content.slice(0, index);
            const afterText = content.slice(index + status.length + 1);
            $text.appendChild(document.createTextNode(beforeText + ' '));
            const $status = document.createElement('span');
            $status.className = (status === 'loaded') ? 'snap-loaded' : 'snap-unloaded';
            $status.textContent = status;
            $text.appendChild($status);
            const cursorTag = ' < cursor';
            const cursorIndex = afterText.indexOf(cursorTag);
            if (cursorIndex === -1) {
              $text.appendChild(document.createTextNode(afterText));
            } else {
              $text.appendChild(document.createTextNode(afterText.slice(0, cursorIndex)));
              const $cursor = document.createElement('span');
              $cursor.className = 'snap-cursor';
              $cursor.textContent = cursorTag;
              $text.appendChild($cursor);
              $text.appendChild(document.createTextNode(
                afterText.slice(cursorIndex + cursorTag.length)
              ));
            }
          } else {
            const cursorTag = ' < cursor';
            const cursorIndex = content.indexOf(cursorTag);
            if (cursorIndex === -1) {
              $text.textContent = content;
            } else {
              $text.appendChild(document.createTextNode(content.slice(0, cursorIndex)));
              const $cursor = document.createElement('span');
              $cursor.className = 'snap-cursor';
              $cursor.textContent = cursorTag;
              $text.appendChild($cursor);
              $text.appendChild(document.createTextNode(
                content.slice(cursorIndex + cursorTag.length)
              ));
            }
          }

          $line.appendChild($indent);
          $line.appendChild($dot);
          $line.appendChild(document.createTextNode(' '));
          $line.appendChild($text);
          pre.appendChild($line);
        }
      }

      function renderSnapshotPair(container, before, after) {
        const $before = document.createElement('div');
        const $after = document.createElement('div');
        const $beforeLabel = document.createElement('div');
        const $afterLabel = document.createElement('div');
        const $beforePre = document.createElement('pre');
        const $afterPre = document.createElement('pre');
        $beforeLabel.textContent = 'Before:';
        $afterLabel.textContent = 'After:';
        renderSnapshot($beforePre, before);
        renderSnapshot($afterPre, after);
        $before.appendChild($beforeLabel);
        $before.appendChild($beforePre);
        $after.appendChild($afterLabel);
        $after.appendChild($afterPre);
        container.appendChild($before);
        container.appendChild($after);
      }

      function renderLegend(container) {
        const $legend = document.createElement('div');
        $legend.className = 'legend';
        const legendItems = [
          { text: '● loaded', className: 'snap-loaded' },
          { text: '○ unloaded', className: 'snap-unloaded' },
          { text: '• neutral', className: '' },
          { text: '< cursor', className: 'snap-cursor' },
          { text: 'window', className: 'snap-window' },
          { text: 'label', className: 'snap-label' },
          { text: 'node', className: 'snap-node' }
        ];
        for (const item of legendItems) {
          const $span = document.createElement('span');
          $span.className = item.className;
          $span.textContent = item.text;
          $legend.appendChild($span);
        }
        container.appendChild($legend);
      }

      function formatSnapshotPairText(before, after) {
        return `\nBefore:\n${before}\nAfter:\n${after}`;
      }

      function formatSnapshotPair(before, after) {
        return formatSnapshotPairText(before, after);
      }

      async function addChild(parent, details) {
        const index = parent.nodes.length;
        return await parent.addChild(index, details, { reason: 'test' });
      }

      testGroup('Rendering');
      test('NodeView renders pinned tab icon', async () => {
        const tree = new Tree(NodeView);
        tree.document = document;
        tree.window = window;
        tree.resolveTreeLoaded();
        const node = await addChild(tree.root, {
          id: 'pinned-tab',
          title: 'Pinned Tab',
          url: 'https://example.com/pinned',
          tabId: 10,
          windowId: 1,
          loaded: true,
          pinned: true
        });

        node.$render();

        const $pin = node.$row.querySelector('.node-pin-icon');
        assert($pin, 'Pinned node should render a pin icon');
        assertEqual($pin.textContent, '📌', 'Pin icon should use pin glyph');
        assertEqual($pin.getAttribute('aria-label'), 'Pinned tab',
          'Pin icon should expose an accessible label');
        assert(node.$row.classList.contains('pinned'),
          'Pinned node row should have pinned class');
      });

      test('NodeView removes pinned tab icon after unpin', async () => {
        const tree = new Tree(NodeView);
        tree.document = document;
        tree.window = window;
        tree.resolveTreeLoaded();
        const node = await addChild(tree.root, {
          id: 'pin-toggle-tab',
          title: 'Pinned Tab',
          url: 'https://example.com/pinned',
          tabId: 10,
          windowId: 1,
          loaded: true,
          pinned: true
        });

        node.$render();
        node.pinned = false;
        node.$render();

        assert(! node.$row.querySelector('.node-pin-icon'),
          'Unpinned node should not render a pin icon');
        assert(! node.$row.classList.contains('pinned'),
          'Unpinned node row should not keep pinned class');
      });

      testGroup('Tab Removal');
      test('onTabRemoved removes boring last tab and window', async () => {
        const tree = createTree();
        const windowNode = await addChild(tree.root, {
          id: 'w1',
          type: 'window',
          windowId: 1,
          loaded: true
        });
        await addChild(windowNode, {
          id: 't1',
          tabId: 10,
          windowId: 1,
          loaded: true,
          url: 'about:blank'
        });

        const before = treeSnapshot(tree.root);
        await tree.onTabRemoved(10, { windowId: 1, isWindowClosing: true });
        const after = treeSnapshot(tree.root);
        const snap = { before, after };

        assertWithSnapshot(!tree.nodes.t1, 'Tab node should be deleted', snap);
        assertWithSnapshot(!tree.nodes.w1, 'Window node should be deleted', snap);
        assertEqualWithSnapshot(tree.root.nodes.length, 0, 'Root should be empty', snap);
        return snap;
      });

      test('onTabRemoved keeps window with metadata', async () => {
        const tree = createTree();
        const windowNode = await addChild(tree.root, {
          id: 'w1',
          type: 'window',
          windowId: 1,
          loaded: true,
          label: 'Saved Window'
        });
        await addChild(windowNode, {
          id: 't1',
          tabId: 10,
          windowId: 1,
          loaded: true,
          url: 'about:blank'
        });

        const before = treeSnapshot(tree.root);
        await tree.onTabRemoved(10, { windowId: 1, isWindowClosing: true });
        const after = treeSnapshot(tree.root);
        const snap = { before, after };

        assertWithSnapshot(!tree.nodes.t1, 'Tab node should be deleted', snap);
        assertWithSnapshot(tree.nodes.w1, 'Window node should remain', snap);
        assertEqualWithSnapshot(tree.root.nodes.length, 1, 'Root should still contain window', snap);
        assertEqualWithSnapshot(tree.nodes.w1.loaded, false, 'Window should be unloaded', snap);
        assertEqualWithSnapshot(tree.nodes.w1.nodes.length, 0, 'Window should have no tabs', snap);
        return snap;
      });

      test('windowClosed before tabRemoved still clears boring window', async () => {
        const tree = createTree();
        const windowNode = await addChild(tree.root, {
          id: 'w1',
          type: 'window',
          windowId: 1,
          loaded: true
        });
        await addChild(windowNode, {
          id: 't1',
          tabId: 10,
          windowId: 1,
          loaded: true,
          url: 'about:blank'
        });

        await windowNode.windowClosed({ reason: 'onWindowRemoved' });
        assert(tree.nodes.w1, 'Window should remain until tab removal');

        await tree.onTabRemoved(10, { windowId: 1, isWindowClosing: true });

        assert(!tree.nodes.t1, 'Tab node should be deleted');
        assert(!tree.nodes.w1, 'Window node should be deleted');
      });

      test('windowClosed flag cleans up when tabRemoved arrives later', async () => {
        const tree = createTree();
        tree.windowsClosing = new Set([1]);
        const windowNode = await addChild(tree.root, {
          id: 'w1',
          type: 'window',
          windowId: 1,
          loaded: true
        });
        await addChild(windowNode, {
          id: 't1',
          tabId: 10,
          windowId: 1,
          loaded: true,
          url: 'about:blank'
        });

        await tree.onTabRemoved(10, { windowId: 1, isWindowClosing: false });

        assert(!tree.nodes.t1, 'Tab node should be deleted');
        assert(!tree.nodes.w1, 'Window node should be deleted');
        assert(!tree.windowsClosing.has(1), 'windowClosed flag should clear');
      });

      testGroup('Window Attach/Created');
      test('onTabAttached uses windowsLoading queue', async () => {
        const tree = createTree();
        const savedWindow = await addChild(tree.root, {
          id: 'w-saved',
          type: 'window',
          loaded: false
        });
        tree.bkgd.windowsLoading.push(savedWindow);

        const oldWindow = await addChild(tree.root, {
          id: 'w1',
          type: 'window',
          windowId: 1,
          loaded: true
        });
        const tabNode = await addChild(oldWindow, {
          id: 't1',
          tabId: 10,
          windowId: 1,
          loaded: true,
          url: 'https://example.com'
        });

        await tree.onTabAttached(10, { newWindowId: 2, newPosition: 0 });

        assertEqual(savedWindow.windowId, 2, 'Saved window should adopt new id');
        assertEqual(tree.root.getWindowId(2), savedWindow, 'Saved window should be used');
        assertEqual(tabNode.parent, savedWindow, 'Tab should move to saved window');
      });

      test('onTabAttached before onWindowCreated creates window', async () => {
        const tree = createTree();
        const oldWindow = await addChild(tree.root, {
          id: 'w1',
          type: 'window',
          windowId: 1,

          );
          assertEqualWithSnapshot(
            windowNode.nodes[0],

            snap
          );
          assertEqualWithSnapshot(
            windowNode.nodes[1],
            childOne,
            'First former child should be promoted in same window tree',
            snap
          );
          assertEqualWithSnapshot(
            windowNode.nodes[2],
            childTwo,
            'Second former child should be promoted in same window tree',
            snap
          );
          assertEqualWithSnapshot(
            windowNode.nodes[3],
            childThree,
            'Third former child should be promoted in same window tree',
            snap
          );
          assertEqualWithSnapshot(

      test('browser tab move can land between promoted children', async () => {
        const tree = createTree();
        const api = getApi();
        const originalTabsGet = api.tabs.get;
        const originalTabsQuery = api.tabs.query;
        try {
          const windowNode = await addChild(tree.root, {
            id: 'window',
            type: 'window',
            windowId: 10,
            loaded: true,
            expanded: true
          });
          const moved = await addChild(windowNode, {
            id: 'a-moved',
            tabId: 1,
            windowId: 10,
            loaded: true,
            title: 'A moved tab'
          });
          const childB = await addChild(moved, {
            id: 'b-child',
            tabId: 2,
            windowId: 10,
            loaded: true,
            title: 'B former child'
          });
          const childC = await addChild(moved, {
            id: 'c-child',
            tabId: 3,
            windowId: 10,
            loaded: true,
            title: 'C former child'
          });
          const siblingD = await addChild(windowNode, {
            id: 'd-sibling',
            tabId: 4,
            windowId: 10,
            loaded: true,
            title: 'D sibling'
          });

          const before = treeSnapshot(tree.root);

          api.tabs.get = async (tabId) => ({
            id: tabId,
            windowId: 10,
            pinned: false
          });
          api.tabs.query = async (queryInfo) => {
            assertEqual(queryInfo.windowId, 10, 'Should query moved window');
            return [
              { id: 2, index: 0, windowId: 10, pinned: false },
              { id: 1, index: 1, windowId: 10, pinned: false },
              { id: 3, index: 2, windowId: 10, pinned: false },
              { id: 4, index: 3, windowId: 10, pinned: false }
            ];
          };

          await tree.onTabMoved(1, {
            windowId: 10,
            fromIndex: 0,
            toIndex: 1
          });

          const after = treeSnapshot(tree.root);
          const snap = { before, after };

          assertEqualWithSnapshot(
            moved.nodes.length,
            0,
            'Moved tab should not keep children after browser tab move',
            snap
          );
          assertEqualWithSnapshot(
            windowNode.nodes.map((node) => node.id).join(','),
            'b-child,a-moved,c-child,d-sibling',
            'Browser order B,A,C,D should become sibling order B,A,C,D',
            snap
          );
          assertEqualWithSnapshot(
            childB.parent,
            windowNode,
            'B should be promoted before moved tab',
            snap
          );
          assertEqualWithSnapshot(
            childC.parent,
            windowNode,
            'C should be promoted after moved tab',
            snap
          );
          assertEqualWithSnapshot(
            siblingD.parent,
            windowNode,
            'D should remain in the same window tree',
            snap
          );

          return snap;
        } finally {
          api.tabs.get = originalTabsGet;
          api.tabs.query = originalTabsQuery;
        }
      });

          });

      testGroup('Tree Utilities');
      test('findMatchingWindow honors exclude list', async () => {
        const tree = createTree();
        const win1 = await addChild(tree.root, { id: 'w1', type: 'window' });
        const win2 = await addChild(tree.root, { id: 'w2', type: 'window' });
        await addChild(win1, { id: 't1', url: 'https://example.com/a', loaded: true });
        await addChild(win1, { id: 't2', url: 'https://example.com/b', loaded: true });
        await addChild(win2, { id: 't3', url: 'https://example.com/a', loaded: true });
        await addChild(win2, { id: 't4', url: 'https://example.com/b', loaded: true });

        const realWindow = {
          id: 101,
          tabs: [
            { id: 1, url: 'https://example.com/a' },
            { id: 2, url: 'https://example.com/b' }
          ]
        };

        const match1 = await tree.findMatchingWindow(realWindow);
        assert(match1, 'Should match a window node');

        const exclude = new Set([match1.id]);
        const match2 = await tree.findMatchingWindow(realWindow, exclude);
        assert(match2, 'Should match a second window node');
        assert(match2.id !== match1.id, 'Exclude list should prevent reuse');
        assertEqual(tree.nodes.t1.tabId, 1, 'Should attach tabId to matched node');
        assertEqual(tree.nodes.t1.wasLoaded, false, 'Matched tab should reset wasLoaded');
      });

      test('promoteKidsToParentAtIndex preserves order', async () => {
        const tree = createTree();
        const parent = await addChild(tree.root, { id: 'p1' });
        const node = await addChild(parent, { id: 'n1' });
        const a = await addChild(node, { id: 'a', label: 'A' });
        const b = await addChild(node, { id: 'b', label: 'B' });
        const c = await addChild(node, { id: 'c', label: 'C' });

        await node.promoteKidsToParentAtIndex(
          parent,
          node.indexOf(),
          { reason: 'userAction' }
        );

        const ids = parent.nodes.map(n => n.id);
        assertEqual(ids[0], 'a', 'First promoted child should stay first');
        assertEqual(ids[1], 'b', 'Second promoted child should stay second');
        assertEqual(ids[2], 'c', 'Third promoted child should stay third');
        assertEqual(ids[3], 'n1', 'Original parent should follow promoted children');
        assertEqual(a.parent, parent, 'Child A should move to parent');
        assertEqual(b.parent, parent, 'Child B should move to parent');
        assertEqual(c.parent, parent, 'Child C should move to parent');
      });

      test('IdGenerator skips cached IDs', async () => {
        const name = 'test';
        const dateDigits = 9;
        const seqDigits = 2;
        const timestamp = 1000;
        const datePart = base32encode(timestamp, dateDigits);
        const cachedId = `${datePart}--${name}`;
        const idGen = new IdGenerator(name, dateDigits, seqDigits);
        idGen.cache = { [cachedId]: true };
        const newId = idGen.newId(timestamp);
        assert(newId !== cachedId, 'Should not reuse cached ID');
        assertEqual(
          newId,
          `${datePart}-${base32encode(1, seqDigits)}-${name}`,
          'Should advance sequence when cached'
        );
      });

      test('IdGenerator throws on explicit timestamp overflow', async () => {
        const idGen = new IdGenerator('test', 2, 1);
        const timestamp = 10;
        idGen.date = timestamp;
        idGen.seq = idGen.maxSeq - 1;
        let threw = false;
        try {
          idGen.newId(timestamp);
        } catch (err) {
          threw = true;
        }
        assert(threw, 'Explicit timestamp overflow should throw');
      });

      test('IdGenerator waits for next ms on implicit overflow', async () => {
        const idGen = new IdGenerator('test', 2, 1);
        idGen.date = 100;
        idGen.seq = idGen.maxSeq;
        const originalNow = Date.now;
        let calls = 0;
        Date.now = () => {
          calls += 1;
          return calls < 3 ? 100 : 101;
        };
        try {
          const newId = idGen.newId();
          const datePart = base32encode(101, 2);
          assertEqual(newId, `${datePart}--test`, 'Should advance to next ms');
        } finally {
          Date.now = originalNow;
        }
      });

      async function runTests() {
        const results = [];

        for (const item of tests) {
          if (item.type === 'group') {
            results.push({ type: 'group', title: item.title });
            continue;
          }
          try {
            const snap = await item.fn();
            results.push({ type: 'test', name: item.name, pass: true, snap });
          } catch (e) {
            results.push({
              type: 'test',
              name: item.name,
              pass: false,
              error: e && e.message ? e.message : String(e),
              snap: e && e.snapshot ? e.snapshot : null
            });
          }
        }

        const $results = document.getElementById('results');
        const $summary = document.getElementById('summary');

        let passCount = 0;
        let failCount = 0;

        for (const result of results) {
          if (result.type === 'group') {
            const $group = document.createElement('h2');
            $group.textContent = result.title;
            $results.appendChild($group);
            continue;
          }
          const $div = document.createElement('div');
          $div.className = 'test-section';

          const $status = document.createElement('span');
          const $name = document.createTextNode(' ' + result.name);

          if (result.pass) {
            passCount++;
            $status.className = 'test-pass';
            $status.textContent = 'PASS:';
            $div.append($status, $name);
            if (result.snap) {
              renderSnapshotPair($div, result.snap.before, result.snap.after);
            }
          } else {
            failCount++;
            $status.className = 'test-fail';
            $status.textContent = 'FAIL:';
            const $error = document.createElement('pre');
            $error.textContent = result.error;
            $div.append($status, $name, $error);
            if (result.snap) {
              renderSnapshotPair($div, result.snap.before, result.snap.after);
            }
          }

          $results.appendChild($div);
        }

        const totalTests = results.filter(r => r.type === 'test').length;
        $summary.textContent = `${passCount} passed, ${failCount} failed out of ${totalTests} tests`;
        $summary.className = failCount === 0 ? 'all-pass' : 'has-fail';

        renderLegend(document.body);

        window.__TEST_RESULTS__ = { passCount, failCount, total: results.length };
        window.__TEST_DONE__ = true;

        console.log(`\nTree/Node Tests: ${passCount} passed, ${failCount} failed`);
        if (failCount > 0) {
          for (const result of results) {
            if (!result.pass) {
              console.error(`FAIL: ${result.name}\n  ${result.error}`);
            }
          }
        }
      }

      runTests();
    }

    main();
